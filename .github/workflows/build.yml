---
name: Build container image for Razer laptop
on:
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 0 1 * *'  # 12:00am UTC first of every month
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "Custom Bazzite KDE+Hyprland"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"  # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_NAME: "bazzite-kdeland-razer"  # output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  BUILD_FROM_IMAGE: "ghcr.io/ublue-os/bazzite-nvidia-open:stable-44"
  BUILD_UPDATE: 0
  BUILD_HYPRLAND: 1
  BUILD_LAPTOP: 0
  BUILD_LAPTOP_CLAMSHELL: 0
  BUILD_LAPTOP_OPENRAZER: 0
  BUILD_CITRIX: 0
  BUILD_CITRIX_DEPS_ONLY: 0
  BUILD_DOCKER: 1
  BUILD_WINE: 1
  BUILD_KVM: 1
  BUILD_SCARLETT: "1"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  publish_guard:
    name: Check publish guard
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}

    steps:
      - name: Check recent published image
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          OWNER_NAME: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "Not a scheduled run; allowing publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$OWNER_TYPE" == "Organization" ]]; then
            api_path="/orgs/$OWNER_NAME/packages/container/$IMAGE_NAME/versions?per_page=100"
          else
            api_path="/users/$OWNER_NAME/packages/container/$IMAGE_NAME/versions?per_page=100"
          fi

          response_file=$(mktemp)
          http_status=$(curl -sS -o "$response_file" -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com$api_path")

          if [[ "$http_status" == "404" ]]; then
            echo "No published image found yet; allowing scheduled publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$http_status" != "200" ]]; then
            echo "Failed to query package versions: HTTP $http_status"
            cat "$response_file"
            exit 1
          fi

          latest_created_at=$(jq -r '[.[].created_at] | sort | last // empty' "$response_file")

          if [[ -z "$latest_created_at" ]]; then
            echo "No package versions returned; allowing scheduled publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
